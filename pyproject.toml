[project]
name = "code-indexer"
version = "0.1.0"
description = "MCP server: automatic semantic code index (Ollama embeddings + Qdrant) with incremental staleness-checked indexing"
readme = "README.md"
license = "MIT"
authors = [
    { name = "sangingeum", email = "sangingeum@gmail.com" }
]
# Pinned to a single Python (3.12) so uv.lock resolves one branch: numpy 1.26.4
# is the only numpy whose x86 baseline imports on this VM and it has no cp313
# wheels; qdrant-client 1.14.x (required for check_compatibility) then
# resolves identically everywhere.
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]<2",
    "numpy<2",
    "ollama>=0.6.2",
    "qdrant-client<1.15",
    "pathspec>=0.12",
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.18.0",
    "typer>=0.12",
    # Watchdog is a hard dependency: the polling fallback in watcher.py is a
    # silent CPU hog (full hash scan per project per quiet tick) and strictly
    # worse, so every install path carries the real watcher backend.
    "watchdog>=6.0.0",
]

[project.scripts]
code-indexer = "code_indexer.cli:main"
code-indexer-mcp = "code_indexer.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]