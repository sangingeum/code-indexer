[project]
name = "code-indexer"
version = "0.1.0"
description = "Code intelligence for agents: a one-shot CLI that indexes a repository into SQLite and answers structural, lexical and optionally semantic queries"
readme = "README.md"
license = "MIT"
authors = [
    { name = "sangingeum", email = "sangingeum@gmail.com" }
]
# Pinned to a single Python (3.12) so uv.lock resolves one branch: numpy 1.26.4
# is the only numpy whose x86 baseline imports on this VM and it has no cp313
# wheels; qdrant-client 1.14.x (required for check_compatibility) then
# resolves identically everywhere.
requires-python = ">=3.12,<3.13"
# Core is parsing, indexing, lexical and structural query: it installs and
# runs with no service of any kind (ADR-0001 section 1).
dependencies = [
    "pathspec>=0.12",
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.18.0",
    "typer>=0.12",
    # Watchdog is a hard dependency: the polling fallback in watcher.py is a
    # silent CPU hog (full hash scan per project per quiet tick) and strictly
    # worse, so every install path carries the real watcher backend.
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
# Embedding and vector storage. numpy is deliberately NOT listed here or in
# the core: it arrives transitively with qdrant-client inside this extra.
semantic = [
    "ollama>=0.6.2",
    "qdrant-client<1.15",
]
# The MCP server is an interface choice, not a retrieval capability: it ships
# as its own extra and is imported only by the code-indexer-mcp entry point.
mcp = [
    "mcp[cli]<2",
]

[project.scripts]
code-indexer = "code_indexer.cli:main"
code-indexer-mcp = "code_indexer.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Default runs exclude live-backend tests; `pytest -m live` runs them.
addopts = "-m 'not live'"
markers = [
    "live: needs real Ollama/Qdrant backends (deselected by default)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Curated gate: correctness rules only for now (the full style set is a
# later cleanup); kept green by the suite + this CI step.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests import after sys.path setup by design.
"tests/*" = ["E402"]
