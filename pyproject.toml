[project]
name = "code-indexer"
version = "0.1.0"
description = "MCP server: automatic semantic code index (Ollama embeddings + Qdrant) with incremental staleness-checked indexing"
readme = "README.md"
authors = [
    { name = "sangingeum", email = "sangingeum@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]<2",
    "numpy<2",
    "ollama>=0.6.2",
    "qdrant-client<1.15",
    "pathspec>=0.12",
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.18.0",
    "typer>=0.12",
]

[project.scripts]
code-indexer = "code_indexer.cli:main"
code-indexer-mcp = "code_indexer.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
