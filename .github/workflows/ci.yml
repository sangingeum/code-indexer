name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/uv-action@v3
        with:
          version: 0.12.5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff check src tests

      - name: Test (offline suite; live-backend tests excluded)
        run: uv run pytest -m "not live"