name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `requires-python` allows 3.13, but the locked dependency set does not
      # install-and-run there: for >=3.13 the lock resolves qdrant-client
      # 1.12.1, which fails at client construction with the locked httpx
      # ("Client.__init__() got an unexpected keyword argument
      # 'check_compatibility'"). Add 3.13 once qdrant-client/numpy allow it.
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group watch

      - name: Run tests
        run: uv run pytest tests/ -q -W error