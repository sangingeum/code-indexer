name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: 0.12.5

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff check src tests

      - name: Test (offline suite; live-backend tests excluded)
        run: uv run pytest -m "not live"
