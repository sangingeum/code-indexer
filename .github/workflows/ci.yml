name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run: a delivery event can be lost while GitHub Actions is
  # degraded, and a red gate that cannot be re-fired hides that.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: 0.12.5

      - name: Sync dependencies (frozen)
        # The offline suite imports the optional surfaces it exercises: the MCP
        # server module and the semantic guard paths. Both extras are part of
        # the test environment, so collection and the guards can run instead of
        # skipping the coverage.
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uvx ruff check src tests scripts

      - name: Test (offline suite; live-backend tests excluded)
        run: uv run pytest -m "not live"
